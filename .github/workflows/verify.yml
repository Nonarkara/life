name: Verify life
on:
  pull_request:
  push:
    branches: [codex/round3-reliability, codex/crisis-chapter]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LIFE_PROBE_FAILURE_DIR: .life-probe-failures
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
        env:
          LIFE_BROWSER_CHANNEL: chromium
      - name: Run the complete preview browser suite
        if: github.event_name != 'pull_request'
        run: node scripts/probes.mjs
        env:
          LIFE_BROWSER_CHANNEL: chromium
      - name: Preserve browser probe failure output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-probe-failures
          path: ${{ env.LIFE_PROBE_FAILURE_DIR }}
          include-hidden-files: true
          if-no-files-found: ignore
