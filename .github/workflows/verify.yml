name: Verify life
on:
  pull_request:
  push:
    branches: [codex/round3-reliability]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
        env:
          LIFE_BROWSER_CHANNEL: chromium
      - name: Run the complete preview browser suite
        if: github.event_name != 'pull_request'
        run: node scripts/probes.mjs
        env:
          LIFE_BROWSER_CHANNEL: chromium
