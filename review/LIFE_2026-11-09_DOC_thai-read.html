<title>Life2.0 Thai Read</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600&display=swap">
<style>
/* One column of lines, a reader's desk: Thai large, English small, one decision per line. */
:root{--bg:#f6f4ee;--fg:#1c2320;--muted:#5d665f;--line:#c9c7bb;--paper:#fffefa;--accent:#a35d00;--ok:#2f6b4f;--th:"IBM Plex Sans Thai","Noto Sans Thai",Prompt,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171a;--fg:#e8ebe6;--muted:#a3ada6;--line:#39423e;--paper:#1a2125;--accent:#f0a23c;--ok:#7fc8a2;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12171a;--fg:#e8ebe6;--muted:#a3ada6;--line:#39423e;--paper:#1a2125;--accent:#f0a23c;--ok:#7fc8a2;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--th);font-size:16px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
h1{font-size:22px;line-height:1.3;margin:0 0 4px;font-weight:600;text-wrap:balance}
.note{margin:0;color:var(--muted);font-size:15px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--line);padding-block:8px;margin-top:10px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;z-index:5}
.bar b{font-variant-numeric:tabular-nums;font-weight:600}
.bar button{font:inherit;font-size:15px;background:none;color:var(--fg);border:0;border-bottom:2px solid transparent;padding:4px 2px;cursor:pointer}
.bar button[aria-pressed=true]{border-bottom-color:var(--accent);font-weight:600}
.bar .copy{margin-left:auto;color:var(--accent)}
#status{width:100%;margin:0;font-size:13px;color:var(--muted)}
.scene{font-size:13px;color:var(--muted);margin:18px 0 0;font-weight:600}
article{padding-block:12px;border-bottom:1px solid var(--line);display:grid;gap:4px}
article.done{opacity:.55}
.th{font-size:19px;line-height:1.65;margin:0}
.en{font-family:Georgia,"Times New Roman",serif;font-size:14px;line-height:1.45;color:var(--muted);margin:0}
.old{font-size:15px;color:var(--muted);margin:0;text-decoration:line-through}
.q{font-size:14px;color:var(--accent);margin:0}
.act{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
.act button{font:inherit;font-size:15px;padding:3px 12px;min-height:34px;background:var(--paper);color:var(--fg);border:1px solid var(--line);cursor:pointer}
.act button.on{border-color:var(--ok);color:var(--ok);font-weight:600}
textarea{font:inherit;font-size:18px;width:100%;box-sizing:border-box;min-height:84px;padding:8px;background:var(--paper);color:var(--fg);border:1px solid var(--accent);border-radius:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
<div class="wrap">
<h1>อ่านภาษาไทยใน Life2.0</h1>
<p class="note">ภาษาไทยชุดนี้ยังไม่เคยผ่านตาคนไทย อ่านแล้วกด “ใช้ได้” หรือ “แก้” แล้วพิมพ์ประโยคที่คนไทยจะพูดจริง ผมจะนำไปใส่ในเกม</p>

<script id="lines" type="application/json">[{"id":"t0","en":"The film on the temple wall","th":"หนังบนกำแพงวัด","where":"1965 · The film on the temple wall","q":"ถ้าเคยดู: รถแบบนี้เรียกหนังขายยาหรือหนังกลางแปลง ควรใส่คำไหนไหม","flag":"check"},{"id":"t88","en":"An agent says a man can earn in Saudi Arabia in two years what the farm earns in twelve. His fee is more than the buffalo and the land paper together.","th":"นายหน้าบอกว่าไปซาอุสองปีได้เท่าทำนาสิบสองปี ค่านายหน้าแพงกว่าควายกับโฉนดที่ดินรวมกัน","where":"1982 · The agent from Bangkok","q":"ถ้าเคยไป: ปี 2525 เรียกค่านายหน้าหรือค่าหัว","flag":"check"},{"id":"t91","en":"Pawn the land paper and go","th":"เอาโฉนดไปจำนองแล้วไป","where":"1982 · The agent from Bangkok","q":"ที่ดินชนบทปี 2525 คนทำกันแบบไหน จำนอง ขายฝาก หรือฝากโฉนด","flag":"check"},{"id":"t1","en":"A van has come to the temple with a projector. The voices are done live by two people behind the screen. Your mother says be home before the second reel.","th":"รถหนังมาฉายที่วัด สองคนพากย์สดอยู่หลังจอ แม่สั่งว่าให้กลับก่อนม้วนที่สอง","where":"1965 · The film on the temple wall","old":"รถหนังมาที่วัด มีเครื่องฉายมาด้วย สองคนหลังจอพากย์สด แม่บอกให้กลับก่อนม้วนที่สอง","flag":"edited","q":"A film van already implies a projector, so มีเครื่องฉายมาด้วย reads as translated."},{"id":"t3","en":"You walked home in the dark and heard the crowd laugh from three fields away.","th":"คุณเดินกลับบ้านมืดๆ ห่างมาสามแปลงนาแล้วยังได้ยินเสียงคนหัวเราะ","where":"1965 · The film on the temple wall","old":"คุณเดินกลับบ้านในความมืด ได้ยินเสียงคนหัวเราะไกลออกไปสามแปลงนา","flag":"edited","q":"ในความมืด and ไกลออกไปสามแปลงนา follow English structure."},{"id":"t5","en":"You stayed. You could do both voices for weeks. Your mother did not speak to you until Sunday.","th":"คุณอยู่จนจบ อีกหลายอาทิตย์ยังดัดเสียงพากย์ได้ทั้งสองเสียง แม่ไม่พูดด้วยจนวันอาทิตย์","where":"1965 · The film on the temple wall","old":"คุณอยู่ดูจนจบ อีกหลายอาทิตย์ยังดัดเสียงพากย์ได้ทั้งสองเสียง แม่ไม่พูดกับคุณจนถึงวันอาทิตย์","flag":"edited","q":"Drops the repeated clause and the object pronoun Thai would omit."},{"id":"t9","en":"Your cousin has a transistor radio from the shop near the bases, and a song on it in a language neither of you speaks. Everyone on the soi wants to sit on your step.","th":"ลูกพี่ลูกน้องได้วิทยุทรานซิสเตอร์มาจากร้านแถวฐานทัพ เปิดเจอเพลงภาษาที่ทั้งสองคนฟังไม่ออก คนทั้งซอยอยากมานั่งตรงบันไดบ้านคุณ","where":"1965 · The transistor radio","old":"ลูกพี่ลูกน้องของคุณมีวิทยุทรานซิสเตอร์จากร้านแถวฐานทัพ ในนั้นมีเพลงภาษาที่คุณทั้งคู่ฟังไม่ออก ทั้งซอยอยากมานั่งที่บันไดบ้านคุณ","flag":"edited","q":"ของคุณ is surplus and ในนั้นมีเพลง is a literal 'on it'."},{"id":"t13","en":"It took seven months of errands. You slept with it under the pillow.","th":"วิ่งรับใช้เขาอยู่เจ็ดเดือนกว่าจะได้ ตอนนอนก็เอาไว้ใต้หมอน","where":"1965 · The transistor radio","old":"รับจ้างวิ่งธุระอยู่เจ็ดเดือนกว่าจะได้ ตอนนอนก็เอาไว้ใต้หมอน","flag":"edited","q":"รับจ้างวิ่งธุระ is a coined rendering of 'errands'."},{"id":"t15","en":"You played badly at a wedding and were paid in food. It was the best year you had.","th":"คุณเล่นห่วยๆ ในงานแต่ง ได้ค่าตัวเป็นข้าวปลา ปีนั้นเป็นปีที่ดีที่สุดของคุณ","where":"1965 · The transistor radio","old":"คุณเล่นแย่ๆ ในงานแต่ง ได้ค่าจ้างเป็นอาหาร เป็นปีที่ดีที่สุดของคุณ","flag":"edited","q":"ค่าจ้างเป็นอาหาร is literal, and the last clause needs a subject."},{"id":"t20","en":"Join the crew","th":"ไปเป็นกรรมกร","where":"1966 · The airfield","old":"เข้าทีมก่อสร้าง","flag":"edited","q":"เข้าทีม is the wrong register for a 1966 labour gang."},{"id":"t21","en":"You were paid in a colour of money the village had not seen. Your back never quite forgave the concrete.","th":"คุณได้ค่าแรงเป็นแบงก์สีที่หมู่บ้านไม่เคยเห็น ตั้งแต่งานคอนกรีตนั้น หลังก็ไม่เคยดีอีกเลย","where":"1966 · The airfield","old":"คุณได้ค่าแรงเป็นเงินสีที่หมู่บ้านไม่เคยเห็น หลังของคุณไม่เคยหายดีจากคอนกรีตอีกเลย","flag":"edited","q":"เงินสี is not idiomatic, and หายดีจากคอนกรีต is a calque."},{"id":"t22","en":"Open a noodle stall outside the gate","th":"ตั้งแผงก๋วยเตี๋ยวหน้าประตูสนามบิน","where":"1966 · The airfield","old":"เปิดร้านก๋วยเตี๋ยวหน้าประตู","flag":"edited","q":"A stall is ตั้งแผง, and bare หน้าประตู does not say which gate."},{"id":"t24","en":"The stall had paid for a shophouse before the planes stopped coming.","th":"เครื่องบินยังไม่ทันเลิกมา ร้านก๋วยเตี๋ยวก็ซื้อตึกแถวได้ห้องหนึ่งแล้ว","where":"1966 · The airfield","old":"ก่อนเครื่องบินจะเลิกมา ร้านนี้ก็หาเงินซื้อตึกแถวได้แล้ว","flag":"edited","q":"A shophouse is counted ห้อง, and ก่อน…จะ follows English order."},{"id":"t26","en":"A friend pushes a paper into your hand asking for a constitution. People have been arrested for handing out this paper. By the end of the week there are more people in the street than you have ever seen.","th":"เพื่อนยัดใบปลิวเรียกร้องรัฐธรรมนูญใส่มือคุณ คนแจกใบปลิวแบบนี้ถูกจับไปแล้ว พอสิ้นอาทิตย์ คนเต็มถนนมากกว่าที่คุณเคยเห็นมาทั้งชีวิต","where":"1973 · October 1973","old":"เพื่อนยัดกระดาษใส่มือคุณ เรียกร้องรัฐธรรมนูญ คนแจกกระดาษแบบนี้ถูกจับไปแล้ว พอสิ้นสัปดาห์ คนบนถนนก็มากกว่าที่คุณเคยเห็นมาทั้งชีวิต","flag":"edited","q":"The historical word is ใบปลิว, and the current line leaves เรียกร้อง with no subject."},{"id":"t28","en":"You heard it on the radio. You have told it since as if you had been there.","th":"คุณฟังจากวิทยุ แต่พอเล่าทีไรก็เหมือนตัวเองอยู่ที่นั่น","where":"1973 · October 1973","old":"คุณฟังทางวิทยุ แต่เล่าต่อมาเหมือนอยู่ที่นั่น","flag":"edited","q":"เล่าต่อมา does not carry 'have told it since'."},{"id":"t38","en":"A letter came in November. He did not say where he had been, and you did not ask.","th":"เดือนพฤศจิกาจดหมายจึงมา เขาไม่บอกว่าไปอยู่ไหนมา คุณก็ไม่ถาม","where":"1973 · The radio plays only music","old":"จดหมายมาถึงเดือนพฤศจิกายน เขาไม่บอกว่าไปอยู่ที่ไหนมา คุณก็ไม่ถาม","flag":"edited","q":"มาถึงเดือนพฤศจิกายน can be misread as reaching November."},{"id":"t40","en":"You walked from hospital to hospital with his school photograph. You found him eating noodles.","th":"คุณถือรูปนักเรียนของเขา เดินตระเวนโรงพยาบาลทีละแห่ง แล้วก็เจอเขานั่งกินก๋วยเตี๋ยวอยู่","where":"1973 · The radio plays only music","old":"คุณเดินจากโรงพยาบาลหนึ่งไปอีกโรงพยาบาลหนึ่ง ถือรูปนักเรียนของเขาไปด้วย แล้วก็เจอเขานั่งกินก๋วยเตี๋ยวอยู่","flag":"edited","q":"จากโรงพยาบาลหนึ่งไปอีกโรงพยาบาลหนึ่ง is word-for-word."},{"id":"t44","en":"You are doing your service. They have put your unit on trucks and not said where. A sergeant from your own province hands out extra bullets and will not look up.","th":"คุณเป็นทหารเกณฑ์ เขาเอาหน่วยคุณขึ้นรถบรรทุก ไม่บอกว่าไปไหน จ่าคนจังหวัดเดียวกันแจกกระสุนเพิ่ม ไม่ยอมเงยหน้ามอง","where":"1973 · The truck to Bangkok","old":"คุณกำลังเป็นทหารเกณฑ์ เขาเอาหน่วยของคุณขึ้นรถบรรทุกโดยไม่บอกว่าไปไหน จ่าจากจังหวัดเดียวกับคุณแจกกระสุนเพิ่ม ไม่ยอมเงยหน้ามอง","flag":"edited","q":"กำลังเป็น copies the English progressive."},{"id":"t46","en":"You stood where they put you. You have never told anyone which street.","th":"เขาให้ยืนตรงไหนคุณก็ยืนตรงนั้น ไม่เคยบอกใครว่าถนนอะไร","where":"1973 · The truck to Bangkok","old":"เขาให้ยืนตรงไหนคุณก็ยืนตรงนั้น คุณไม่เคยบอกใครว่าถนนอะไร","flag":"edited","q":"The second คุณ should drop."},{"id":"t48","en":"You spent the week in the latrine block. The others came back quiet and did not call you anything.","th":"ทั้งอาทิตย์นั้นคุณอยู่แต่ในโรงส้วม คนอื่นกลับมาเงียบๆ ไม่มีใครว่าอะไรคุณสักคำ","where":"1973 · The truck to Bangkok","old":"ทั้งอาทิตย์นั้นคุณอยู่แต่ในโรงส้วม คนอื่นกลับมาเงียบๆ ไม่มีใครเรียกคุณว่าอะไรเลย","flag":"edited","q":"เรียกคุณว่าอะไร translates the words; the sense is that nobody abused you."},{"id":"t50","en":"You fired at the sky. You will never be sure about where it came down.","th":"คุณยิงขึ้นฟ้า และไม่มีวันรู้แน่ว่ากระสุนไปตกตรงไหน","where":"1973 · The truck to Bangkok","old":"คุณยิงขึ้นฟ้า คุณจะไม่มีวันรู้แน่ว่ากระสุนไปตกตรงไหน","flag":"edited","q":"Repeated คุณ."},{"id":"t52","en":"Your friends are sleeping at the university. The army radio has started calling them traitors by name. You have a box of books under the bed with your handwriting in them.","th":"เพื่อนๆ นอนค้างอยู่ในมหาวิทยาลัย วิทยุยานเกราะเริ่มเรียกพวกเขาว่าคนขายชาติ ขานชื่อกันเลย ใต้เตียงคุณมีลังหนังสือ ข้างในมีลายมือคุณ","where":"1976 · The first week of October 1976","old":"เพื่อนๆ นอนค้างอยู่ในมหาวิทยาลัย วิทยุทหารเริ่มเรียกพวกเขาว่าคนขายชาติ เอ่ยชื่อเลย ใต้เตียงคุณมีลังหนังสือที่มีลายมือคุณอยู่ข้างใน","flag":"edited","q":"Those who lived it know the army radio as ยานเกราะ, and the ที่มี clause is translated."},{"id":"t56","en":"They took a long time to burn. You stirred the ash into the drain.","th":"กว่าจะไหม้หมดก็นาน คุณกวาดขี้เถ้าลงท่อ","where":"1976 · The first week of October 1976","old":"กว่าจะไหม้หมดก็นาน คุณกวนขี้เถ้าลงท่อ","flag":"edited","q":"กวน is what you do to a pot."},{"id":"t59","en":"You took food to the university gate on the morning of 6 October 1976. Nobody found out what happened to you for a long time.","th":"เช้าวันที่ 6 ตุลา 2519 คุณเอาข้าวไปส่งที่หน้าประตูมหาวิทยาลัย อีกนานกว่าจะมีคนรู้ว่าคุณเป็นตายร้ายดีอย่างไร","where":"History","old":"เช้าวันที่ 6 ตุลา 2519 คุณเอาข้าวไปส่งที่หน้าประตูมหาวิทยาลัย นานมากกว่าจะมีคนรู้ว่าเกิดอะไรขึ้นกับคุณ","flag":"edited","q":"เกิดอะไรขึ้นกับคุณ is a calque, and นานมากกว่า misparses."},{"id":"t61","en":"You went in the back of a truck with a false name. The first thing they taught you was how to sleep sitting up.","th":"คุณนั่งท้ายรถบรรทุกไปในชื่อปลอม อย่างแรกที่เขาสอนคือนั่งหลับ","where":"1976 · The first week of October 1976","old":"คุณนั่งท้ายรถบรรทุกไปด้วยชื่อปลอม สิ่งแรกที่เขาสอนคือนอนทั้งที่นั่งอยู่","flag":"edited","q":"The Thai verb is นั่งหลับ."},{"id":"t65","en":"He wrote something down anyway. The student left in the night and paid the rent first.","th":"เขาก็จดอะไรไว้อยู่ดี นักศึกษาคนนั้นไปตอนกลางคืน จ่ายค่าเช่าไว้ก่อนแล้ว","where":"1976 · A list of names","old":"เขาก็จดอะไรบางอย่างไว้อยู่ดี นักศึกษาคนนั้นออกไปตอนกลางคืน จ่ายค่าเช่าไว้ก่อนแล้ว","flag":"edited","q":"อะไรบางอย่าง is a calque of 'something'."},{"id":"t70","en":"He thanked you. He still greets you at the market. You still answer.","th":"เขาขอบใจ ทุกวันนี้เจอกันที่ตลาดเขายังทัก คุณก็ยังทักตอบ","where":"1976 · A list of names","old":"เขาขอบคุณคุณ ทุกวันนี้เจอกันที่ตลาดเขายังทักอยู่ คุณก็ยังทักตอบ","flag":"edited","q":"เขาขอบคุณคุณ is the classic translated pronoun."},{"id":"t72","en":"Men come after dark and ask for rice, politely. In the morning an officer comes and asks, politely, who came.","th":"พอมืดมีผู้ชายมาขอข้าว พูดจาสุภาพ พอเช้านายทหารมาถาม พูดจาสุภาพ ว่าใครมา","where":"1975 · Rice at night","old":"พอมืด มีคนมาขอข้าวอย่างสุภาพ พอเช้า นายทหารมาถามอย่างสุภาพว่าใครมา","flag":"edited","q":"อย่างสุภาพ is an English adverb pattern, and the source says men."},{"id":"t74","en":"You said you sleep early. Both sides seemed to accept it. You stopped sleeping.","th":"คุณบอกว่านอนหัวค่ำ ทั้งสองฝ่ายดูจะเชื่อ ตั้งแต่นั้นคุณก็นอนไม่หลับ","where":"1975 · Rice at night","old":"คุณบอกว่านอนหัวค่ำ ดูเหมือนทั้งสองฝ่ายจะยอมรับ คุณเลิกนอนหลับ","flag":"edited","q":"ยอมรับ and เลิกนอนหลับ are literal."},{"id":"t83","en":"You signed a paper at a district office. The clerk had been at school with you, and neither of you said so.","th":"คุณไปเซ็นชื่อที่อำเภอ เสมียนเคยเรียนโรงเรียนเดียวกับคุณ ต่างคนต่างไม่พูดถึง","where":"1980 · Come home","old":"คุณเซ็นเอกสารที่ที่ว่าการอำเภอ เสมียนเคยเรียนโรงเรียนเดียวกับคุณ ต่างคนต่างไม่พูดถึง","flag":"edited","q":"ที่ที่ว่าการ stumbles, and villagers say ที่อำเภอ."},{"id":"t90","en":"You stayed. The neighbour who went built a house of concrete, and you helped carry the blocks.","th":"คุณอยู่ เพื่อนบ้านที่ไปซาอุกลับมาปลูกบ้านปูน คุณไปช่วยขนอิฐบล็อก","where":"1982 · The agent from Bangkok","old":"คุณอยู่ เพื่อนบ้านที่ไปสร้างบ้านปูน คุณไปช่วยขนอิฐบล็อก","flag":"edited","q":"As written it reads 'the neighbour who went to build a house'."},{"id":"t92","en":"You left in a borrowed jacket. It was forty-six degrees and they gave you a bed in a container.","th":"คุณใส่เสื้อแจ็กเก็ตที่ยืมเขาไป ที่โน่นสี่สิบหกองศา เขาให้เตียงในตู้คอนเทนเนอร์","where":"1982 · The agent from Bangkok","old":"คุณไปด้วยเสื้อแจ็กเก็ตที่ยืมเขามา อากาศสี่สิบหกองศา เขาให้เตียงในตู้คอนเทนเนอร์","flag":"edited","q":"ไปด้วยเสื้อแจ็กเก็ต copies 'left in a jacket'."},{"id":"t100","en":"You sent home half of every packet. You could sew a collar in your sleep, and you did.","th":"คุณส่งเงินกลับบ้านครึ่งซองทุกงวด หลับไปด้วยเย็บปกเสื้อไปด้วยก็ยังได้ และคุณก็ทำอย่างนั้นจริงๆ","where":"1985 · The factory bus","old":"คุณส่งเงินกลับบ้านครึ่งซองทุกครั้ง เย็บปกเสื้อได้แม้ตอนหลับ และก็เป็นอย่างนั้นจริงๆ","flag":"edited","q":"แม้ตอนหลับ is written-language and loses the joke."},{"id":"t102","en":"A man in good shoes is offering cash for rice land along the line of a road that may or may not be built. Your family has been on this land for three generations. He has offered more than it has ever earned.","th":"ผู้ชายใส่รองเท้าดีมาขอซื้อที่นาเงินสด ตามแนวถนนที่อาจจะตัดหรือไม่ตัดก็ไม่รู้ บ้านคุณอยู่บนที่ผืนนี้มาสามชั่วคน เขาให้ราคามากกว่าที่นาผืนนี้เคยทำเงินได้","where":"1988 · The road is coming","old":"ผู้ชายรองเท้าดีมาขอซื้อที่นาด้วยเงินสด ตามแนวถนนที่อาจจะสร้างหรือไม่ก็ได้ ครอบครัวคุณอยู่ที่นี่มาสามชั่วคน เขาให้ราคามากกว่าที่ที่ผืนนี้เคยทำเงินได้","flag":"edited","q":"Roads are ตัด, and ที่ที่ผืนนี้ stumbles."},{"id":"t104","en":"You told him no at the gate. You walked the edge of the field that evening.","th":"คุณบอกเขาว่าไม่ขายตั้งแต่หน้าประตู เย็นนั้นเดินรอบคันนา","where":"1988 · The road is coming","old":"คุณปฏิเสธเขาที่หน้าประตู เย็นนั้นคุณเดินรอบคันนา","flag":"edited","q":"ปฏิเสธเขา is English-shaped."},{"id":"t112","en":"They are in the street again, with mobile phones this time. Your office has told everyone to go home. You have a car, and the hospital is across the bridge.","th":"คนลงถนนอีกแล้ว คราวนี้ถือมือถือมาด้วย ที่ทำงานสั่งทุกคนกลับบ้าน คุณมีรถ โรงพยาบาลอยู่อีกฝั่งสะพาน","where":"1992 · May 1992","old":"คนออกมาบนถนนอีกแล้ว คราวนี้มีมือถือด้วย ที่ทำงานสั่งทุกคนกลับบ้าน คุณมีรถ โรงพยาบาลอยู่อีกฝั่งสะพาน","flag":"edited","q":"The idiom is ลงถนน."},{"id":"t120","en":"You were standing on Ratchadamnoen in May 1992. Your family is still waiting for a report.","th":"พฤษภา 35 คุณยืนอยู่บนถนนราชดำเนิน ครอบครัวยังรอผลสอบอยู่จนทุกวันนี้","where":"History","old":"พฤษภา 35 คุณยืนอยู่บนถนนราชดำเนิน ครอบครัวยังรอรายงานอยู่จนทุกวันนี้","flag":"edited","q":"Bare รายงาน does not say inquiry report."},{"id":"t124","en":"At dinner they asked if you had stopped believing in the country.","th":"ตอนกินข้าว มีคนถามว่าคุณเลิกเชื่อในประเทศนี้แล้วเหรอ","where":"1996 · Everyone is borrowing","old":"ตอนกินข้าว มีคนถามว่าคุณเลิกเชื่อมั่นในประเทศแล้วเหรอ","flag":"edited","q":"เชื่อมั่น is investor vocabulary."},{"id":"t128","en":"The baht went from 25 to the dollar to more than 50. The tower stopped at the eleventh floor. You paid for it for nineteen years.","th":"ค่าบาทจาก 25 ต่อดอลลาร์ไปเกิน 50 ตึกหยุดอยู่ที่ชั้นสิบเอ็ด คุณผ่อนอยู่สิบเก้าปี","where":"1996 · Everyone is borrowing","old":"พอลอยตัวค่าบาท เงินจาก 25 บาทต่อดอลลาร์ไปเกิน 50 ตึกหยุดอยู่ที่ชั้นสิบเอ็ด คุณผ่อนอยู่สิบเก้าปี","flag":"edited","q":"พอลอยตัวค่าบาท is not in the source, and เงินจาก 25 บาท has the wrong subject."},{"id":"t130","en":"Twelve per cent. They gave you a calendar.","th":"ดอกเบี้ย 12 เปอร์เซ็นต์ แถมปฏิทินอีกอันหนึ่ง","where":"1996 · Everyone is borrowing","old":"ดอกเบี้ย 12 เปอร์เซ็นต์ เขาให้ปฏิทินมาอันหนึ่ง","flag":"edited","q":"แถม is the dry Thai word for a free calendar."},{"id":"t138","en":"Sell food on the pavement","th":"ขายของกินริมฟุตบาท","where":"1997 · The notice on the gate","old":"ขายของกินริมทางเท้า","flag":"edited","q":"People say ฟุตบาท for a place to sell food."},{"id":"t142","en":"Serve the food and say nothing","th":"ยกกับข้าวมา ไม่พูดอะไร","where":"2010 · Two colours at one table","old":"จัดอาหาร แล้วไม่พูดอะไร","flag":"edited","q":"จัดอาหาร is catering Thai."},{"id":"t143","en":"You served the food. The family meets on separate days now, and calls it convenience.","th":"คุ ติดมาจากงานนั้น","where":"History","old":"ปี 2563 คุณไปงานศพงานหนึ่ง แล้วติดเชื้อมาจากที่นั่น","flag":"edited","q":"ติดเชื้อมาจากที่นั่น is news copy."},{"id":"t254","en":"Your grandfather still counts in Teochew. He is trying to teach you the words for food, and your friends have started doing his accent.","th":"อากงยังนับเลขเป็นแต้จิ๋ว แกพยายามสอนคำเรียกของกินให้ เพื่อนๆ เริ่มล้อสำเนียงแกแล้ว","where":"Question at age 10","old":"อากงยังนับเลขเป็นแต้จิ๋ว เขาพยายามสอนคำเรียกของกินให้ และเพื่อนเริ่มล้อสำเนียงเขาแล้ว","flag":"edited","q":"แก suits an old man; อากง is kept because he is Teochew-speaking, though it leans paternal."},{"id":"t258","en":"You learned the words for food, which was most of what he had to say in that language.","th":"คุณจำคำเรียกของกินได้ เกือบทั้งหมดที่แกมีจะพูดเป็นภาษานั้นก็มีแค่นี้","where":"Question at age 10","old":"คุณจำคำเรียกของกินได้ ซึ่งก็คือเกือบทั้งหมดที่เขามีจะพูดในภาษานั้น","flag":"edited","q":"ซึ่งก็คือ is translated 'which was'."},{"id":"t259","en":"Answer him in Thai","th":"ตอบเป็นภาษาไทย","where":"Question at age 10","old":"ตอบกลับเป็นภาษาไทย","flag":"edited","q":"ตอบกลับ is email Thai."},{"id":"t260","en":"He will stop trying sooner than you expect.","th":"แกจะเลิกพยายามเร็วกว่าที่คิด","where":"Question at age 10","old":"เขาจะเลิกพยายามเร็วกว่าที่คิด","flag":"edited","q":"Matches t254."},{"id":"t261","en":"You answered in Thai. One year he stopped asking.","th":"คุณตอบเป็นภาษาไทย แล้วปีหนึ่งแกก็เลิกถาม","where":"Question at age 10","old":"คุณตอบเป็นภาษาไทย แล้วปีหนึ่งเขาก็เลิกถาม","flag":"edited","q":"Matches t254."},{"id":"t262","en":"Your uncle’s boat needs another pair of hands for the season. The teacher says a child who misses a season does not usually come back.","th":"เรือลุงขาดคนช่วยฤดูนี้ ครูบอกว่าเด็กที่หยุดไปฤดูหนึ่งมักไม่กลับมาเรียนอีก","where":"Question at age 10","old":"เรือของลุงขาดคนช่วยฤดูนี้ ครูบอกว่าเด็กที่หยุดไปหนึ่งฤดูมักไม่กลับมาเรียนอีก","flag":"edited","q":"ของ and หนึ่งฤดู are English-shaped."},{"id":"t265","en":"School will go on without you.","th":"ไม่มีคุณ โรงเรียนก็เรียนกันต่อ","where":"Question at age 10","old":"โรงเรียนจะเดินต่อโดยไม่มีคุณ","flag":"edited","q":"โรงเรียนจะเดินต่อ is a calque."},{"id":"t266","en":"You learned the water. You did not go back to school that year.","th":"คุณรู้จักทะเล ปีนั้นไม่ได้กลับไปโรงเรียน","where":"Question at age 10","old":"คุณรู้จักทะเล ปีนั้นคุณไม่ได้กลับไปโรงเรียน","flag":"edited","q":"ทะเล assumes the sea; the source says the water and the boat could be on a river."},{"id":"t268","en":"Your uncle hires someone, and the family pays for it.","th":"ลุงจ้างคนอื่น ที่บ้านต้องออกค่าจ้าง","where":"Question at age 10","old":"ลุงจ้างคนอื่น และบ้านต้องเป็นคนจ่าย","flag":"edited","q":"บ้านต้องเป็นคนจ่าย is a calque."},{"id":"t269","en":"You stayed in school. Your uncle stopped asking you to the boat.","th":"คุณอยู่เรียนต่อ ลุงเลิกชวนลงเรือ","where":"Question at age 10","old":"คุณอยู่เรียนต่อ ลุงเลิกชวนคุณลงเรือ","flag":"edited","q":"The second คุณ should drop."},{"id":"t270","en":"One child has to stay home to mind the buffalo, and you are the one old enough. The teacher walks out to the house to ask your parents not to choose you.","th":"ต้องมีลูกสักคนอยู่เลี้ยงควาย คนที่โตพอคือคุณ ครูเดินมาถึงบ้าน ขอพ่อแม่ว่าอย่าเลือกคุณ","where":"Question at age 10","old":"ต้องมีลูกสักคนอยู่บ้านเลี้ยงควาย และคุณโตพอแล้ว ครูเดินมาถึงบ้านเพื่อขอพ่อแม่ว่าอย่าเลือกคุณ","flag":"edited","q":"เพื่อขอ is a purpose calque, and 'the one old enough' was lost."},{"id":"t271","en":"Your parents have not said no to the teacher, and they have not said yes.","th":"พ่อแม่ยังไม่รับปากครู แต่ก็ไม่ได้ปฏิเสธ","where":"Question at age 10","old":"พ่อแม่ยังไม่ได้ปฏิเสธครู และยังไม่ได้รับปาก","flag":"edited","q":"Thai puts the two halves in a but-relation."},{"id":"t277","en":"You went to school. A younger child stayed home for you, and nobody mentioned it.","th":"คุณได้ไปโรงเรียน น้องอยู่บ้านแทน ไม่มีใครพูดถึงเรื่องนี้","where":"Question at age 10","old":"คุณได้ไปโรงเรียน น้องอยู่บ้านแทนคุณ และไม่มีใครพูดถึงเรื่องนี้","flag":"edited","q":"Surplus คุณ and และ."},{"id":"t278","en":"There is money for one child to go on to secondary school, and your parents have decided it is your brother. He is not the one with the marks.","th":"เงินพอส่งลูกเรียนมัธยมได้คนเดียว พ่อแม่ตัดสินใจให้พี่น้องผู้ชายของคุณ ทั้งที่คนคะแนนดีคือคุณ","where":"Question at age 15","old":"เงินพอส่งลูกเรียนมัธยมได้คนเดียว และพ่อแม่ตัดสินใจเลือกพี่หรือน้องชาย ทั้งที่คะแนนดีกว่าคือคุณ","flag":"edited","q":"พี่หรือน้องชาย is an editor's hedge, not a Thai sentence."},{"id":"t282","en":"You left school that March. Your brother did not thank you, because nobody told him.","th":"คุณออกจากโรงเรียนเดือนมีนาคมปีนั้น พี่น้องคนนั้นไม่ได้ขอบคุณ เพราะไม่มีใครบอกเขา","where":"Question at age 15","old":"คุณออกจากโรงเรียนเดือนมีนาคมปีนั้น พี่น้องผู้ชายไม่ได้ขอบคุณ เพราะไม่มีใครบอกเขา","flag":"edited","q":"พี่น้องผู้ชาย as a bare subject reads like a form field."},{"id":"t285","en":"The teacher came. You went on to the secondary school, and your parents paid without once looking at your report.","th":"ครูมา คุณได้เรียนต่อมัธยม พ่อแม่จ่ายค่าเล่าเรียน ไม่เคยเปิดสมุดพกดูเลย","where":"Question at age 15","old":"ครูมา คุณได้เรียนมัธยม และพ่อแม่จ่ายค่าเรียนโดยไม่เคยเปิดดูสมุดพกเลย","flag":"edited","q":"โดยไม่เคย is written-English 'without once'."},{"id":"t286","en":"The abbot says a boy who ordains as a novice can go to the temple school in the city and eat for free. It is how the poor get to Bangkok.","th":"เจ้าอาวาสบอกว่าเด็กที่บวชเณรจะได้ไปเรียนโรงเรียนวัดในเมือง กินฟรี ลูกคนจนเข้ากรุงเทพฯ กันทางนี้","where":"Question at age 15","old":"เจ้าอาวาสบอกว่าเด็กที่บวชเณรจะได้ไปเรียนโรงเรียนวัดในเมือง กินฟรี คนจนเข้ากรุงเทพฯ กันด้วยทางนี้","flag":"edited","q":"ด้วยทางนี้ is not idiomatic."},{"id":"t287","en":"It also means leaving, at fifteen, in a robe.","th":"แต่ก็ต้องจากบ้านตั้งแต่อายุสิบห้า ในผ้าเหลือง","where":"Question at age 15","old":"นั่นหมายถึงการจากบ้านตอนอายุสิบห้า ในผ้าเหลือง","flag":"edited","q":"นั่นหมายถึงการ is a translator's nominalisation."},{"id":"t290","en":"You ordained and went. You learned to read Pali and to be hungry after noon.","th":"คุณบวชแล้วไป ได้หัดอ่านบาลี และหัดหิวหลังเที่ยง","where":"Question at age 15","old":"คุณบวชแล้วเดินทาง ได้หัดอ่านบาลี และหัดหิวหลังเที่ยง","flag":"edited","q":"เดินทาง is too formal and breaks the echo of the option."},{"id":"t293","en":"You stayed. The abbot took the boy from the next house.","th":"คุณอยู่ เจ้าอาวาสพาเด็กข้างบ้านไปแทน","where":"Question at age 15","old":"คุณอยู่ เจ้าอาวาสพาเด็กบ้านถัดไปไปแทน","flag":"edited","q":"ถัดไปไปแทน stumbles."},{"id":"t294","en":"They are short of trained people in America and they have written to you. The visa is real. Your parents are getting older.","th":"อเมริกาขาดคนมีวิชา เขาเขียนจดหมายมาหาคุณ วีซ่าของจริง พ่อแม่ก็แก่ลงทุกปี","where":"Question at age 30","old":"อเมริกาขาดคนที่มีความรู้ และเขียนจดหมายมาหาคุณ วีซ่าเป็นของจริง พ่อแม่ก็อายุมากขึ้นทุกปี","flag":"edited","q":"คนที่มีความรู้ and เป็นของจริง are stiff."},{"id":"t303","en":"Your child has not asked. Your child has stopped mentioning it.","th":"ลูกไม่ได้ขอ และเลิกพูดถึงเรื่องนี้แล้ว","where":"Question at age 40","old":"ลูกไม่ได้ขอ และเลิกพูดถึงมันแล้ว","flag":"edited","q":"พูดถึงมัน is translated 'it'."},{"id":"t306","en":"You sold the house and rented the one behind it. The letters home were short and the results were good.","th":"คุณขายบ้าน ไปเช่าหลังที่อยู่ติดกันด้านหลัง จดหมายจากลูกสั้น ผลการเรียนดี","where":"Question at age 40","old":"คุณขายบ้านแล้วเช่าหลังข้างหลัง จดหมายจากลูกสั้น ส่วนผลการเรียนดี","flag":"edited","q":"หลังข้างหลัง stumbles, and ส่วน is not needed."},{"id":"t311","en":"The field is full of frogs tonight, and the torch is yours if you want it.","th":"คืนนี้กบเต็มทุ่ง อยากออกไปก็เอาไฟฉายไปได้เลย","where":"New roads and childhood","old":"คืนนี้กบเต็มทุ่ง ไฟฉายเป็นของคุณถ้าอยากออกไป","flag":"edited","q":"ไฟฉายเป็นของคุณถ้า is English word order."},{"id":"t314","en":"Stay in with your grandmother","th":"อยู่บ้านกับยาย","where":"New roads and childhood","old":"อยู่บ้านกับย่ายาย","flag":"edited","q":"ย่ายาย is not a word; แม่เฒ่า is side-neutral, or the code could pick ย่า or ยาย per life."},{"id":"t315","en":"She told the one about the well again.","th":"แกเล่าเรื่องบ่อน้ำเรื่องเดิมอีกแล้ว","where":"New roads and childhood","old":"ท่านเล่าเรื่องบ่อน้ำเรื่องเดิมอีกครั้ง","flag":"edited","q":"ท่าน is too reverent for this voice, and อีกครั้ง is written-language."},{"id":"t317","en":"The ice-cream cart is coming down the soi. You have one coin, and a younger cousin is looking at it.","th":"รถไอติมกำลังเข้ามาในซอย คุณมีเหรียญเดียว ญาติตัวเล็กๆ คนหนึ่งจ้องเหรียญอยู่","where":"New roads and childhood","old":"รถไอศกรีมกำลังมาตามซอย คุณมีเหรียญเดียว และญาติตัวเล็กกำลังมองมันอยู่","flag":"edited","q":"Children say ไอติม, and มองมันอยู่ is translated 'looking at it'."},{"id":"t321","en":"It was very cold and it was gone very quickly.","th":"เย็นมาก และหมดเร็วมาก","where":"New roads and childhood","old":"มันเย็นมาก และหมดเร็วมาก","flag":"edited","q":"มัน is not needed."},{"id":"t325","en":"Your grandmother wants someone to carry the food to the monks before it is light.","th":"ยายอยากได้คนช่วยถือสำรับไปถวายพระก่อนฟ้าสาง","where":"New roads and childhood","old":"ย่ายายอยากให้มีคนช่วยถือสำรับไปถวายพระก่อนฟ้าสาง","flag":"edited","q":"ย่ายาย is not a word."},{"id":"t327","en":"You walked behind her in the dark with the food getting heavier.","th":"คุณเดินตามแกในความมืด สำรับหนักขึ้นเรื่อยๆ","where":"New roads and childhood","old":"คุณเดินตามท่านในความมืด สำรับหนักขึ้นเรื่อย ๆ","flag":"edited","q":"Matches t315 and fixes ๆ spacing."},{"id":"t329","en":"She went alone. Nobody said anything about it at breakfast.","th":"แกไปคนเดียว มื้อเช้าไม่มีใครพูดถึงเรื่องนี้","where":"New roads and childhood","old":"ท่านไปคนเดียว มื้อเช้าไม่มีใครพูดถึงเรื่องนี้","flag":"edited","q":"Matches t315."},{"id":"t331","en":"Care for those close to you","th":"ดูแลคนใกล้ตัว","where":"New roads and childhood","old":"การดูแลคนใกล้ตัว","flag":"edited","q":"การ is not needed on a label."},{"id":"t338","en":"SET Index, December close (Wikipedia table).","th":"ดัชนีหุ้นไทย ปิดสิ้นธันวาคม (ตารางจากวิกิพีเดีย)","where":"New roads and childhood","old":"ดัชนี SET ปิดสิ้นปี (ตาราง Wikipedia)","flag":"edited","q":"Latin letters, and the source says December close."},{"id":"t339","en":"Care {c}. Responsibility {d}. Yours: {e} and {f}.","th":"ดูแล {c} รับผิดชอบ {d} ของคุณ: {e} และ {f}","where":"New roads and childhood","old":"การดูแล {c} ความรับผิดชอบ {d} ของคุณ: {e} และ {f}","flag":"edited","q":"Matches t331 and t332."},{"id":"t340","en":"Live this road →","th":"ลองใช้ชีวิตทางนี้ →","where":"New roads and childhood","old":"ใช้ชีวิตบนทางนี้ →","flag":"edited","q":"ใช้ชีวิตบนทาง is a calque."},{"id":"t344","en":"At {n} your lives parted. They chose: {a}. You chose: {b}.","th":"ตอนอายุ {n} ชีวิตของสองคนแยกทางกัน เขาเลือก: {a} คุณเลือก: {b}","where":"New roads and childhood","old":"ตอนอายุ {n} ทางของคุณแยกกัน เขาเลือก: {a} คุณเลือก: {b}","flag":"edited","q":"ทางของคุณ reads as the player's road alone."},{"id":"t345","en":"You answered every question the same way.","th":"คุณตอบเหมือนเขาทุกข้อ","where":"New roads and childhood","old":"คุณตอบทุกคำถามเหมือนกัน","flag":"edited","q":"Alone เหมือนกัน can mean all answers were identical to each other."},{"id":"t346","en":"Put half your savings in","th":"เอาเงินเก็บลงครึ่งหนึ่ง","where":"Market moment","old":"ลงครึ่งหนึ่งของเงินเก็บ","flag":"edited","q":"ครึ่งหนึ่งของเงินเก็บ is English word order."},{"id":"t348","en":"If it falls, it falls with your money.","th":"ถ้าหุ้นร่วง เงินคุณก็ร่วงไปด้วย","where":"Market moment","old":"ถ้ามันร่วง เงินก็ร่วงไปด้วย","flag":"edited","q":"มัน has no antecedent."},{"id":"t349","en":"If it rises, you will hear about it.","th":"ถ้าหุ้นขึ้น จะมีคนมาเล่าให้ฟัง","where":"Market moment","old":"ถ้ามันขึ้น จะมีคนมาเล่าให้ฟัง","flag":"edited","q":"มัน has no antecedent."},{"id":"t351","en":"The Bangkok stock market has tripled in two years. Someone at your work has bought a motorcycle with the winnings.","th":"ตลาดหุ้นโตสามเท่าในสองปี คนที่ทำงานเดียวกันได้กำไรหุ้นไปถอยมอเตอร์ไซค์","where":"Market moment","old":"ตลาดหุ้นกรุงเทพฯ โตสามเท่าในสองปี คนที่ทำงานเดียวกันถอยมอเตอร์ไซค์ด้วยกำไรจากหุ้น","flag":"edited","q":"Nobody says ตลาดหุ้นกรุงเทพฯ; the exchange is simply ตลาดหุ้น."},{"id":"t354","en":"By 1983 the index stood at 134. Every ฿100 you put in was worth ฿52.","th":"ถึงปี 2526 ดัชนีอยู่ที่ 134 ทุก ฿100 ที่ลงไปกลายเป็น ฿52","where":"Market moment","old":"ถึงปี 2526 ดัชนีอยู่ที่ 134 ทุก ๆ ฿100 ที่ลงไปมีค่า ฿52","flag":"edited","q":"ทุก ๆ and มีค่า are translated."},{"id":"t355","en":"The index has nearly doubled this year. Your barber is giving tips.","th":"ดัชนีขึ้นเกือบเท่าตัวในปีเดียว ช่างตัดผมเริ่มบอกหุ้น","where":"Market moment","old":"ดัชนีเกือบเท่าตัวในปีเดียว ช่างตัดผมเริ่มบอกหุ้น","flag":"edited","q":"The sentence has no verb."},{"id":"t358","en":"By 1998 the index stood at 356. Every ฿100 you put in was worth ฿21.","th":"ถึงปี 2541 ดัชนีอยู่ที่ 356 ทุก ฿100 ที่ลงไปกลายเป็น ฿21","where":"Market moment","old":"ถึงปี 2541 ดัชนีอยู่ที่ 356 ทุก ๆ ฿100 ที่ลงไปมีค่า ฿21","flag":"edited","q":"Matches t354."},{"id":"t359","en":"The index has lost almost four-fifths since 1993. The people who talked about shares at dinner have stopped.","th":"ดัชนีหายไปเกือบสี่ในห้าตั้งแต่ปี 2536 คนที่เคยคุยเรื่องหุ้นบนโต๊ะกินข้าวเลิกพูดกันแล้ว","where":"Market moment","old":"ดัชนีหายไปเกือบสี่ในห้านับจากปี 2536 คนที่เคยคุยเรื่องหุ้นบนโต๊ะอาหารเลิกพูดกันแล้ว","flag":"edited","q":"นับจาก is written-language and โต๊ะอาหาร breaks the game's โต๊ะกินข้าว."},{"id":"t362","en":"By 2003 the index stood at 772. Every ฿100 you put in was worth ฿217.","th":"ถึงปี 2546 ดัชนีอยู่ที่ 772 ทุก ฿100 ที่ลงไปกลายเป็น ฿217","where":"Market moment","old":"ถึงปี 2546 ดัชนีอยู่ที่ 772 ทุก ๆ ฿100 ที่ลงไปมีค่า ฿217","flag":"edited","q":"Matches t354."},{"id":"t363","en":"Banks are failing in America, and the Bangkok index has almost halved in twelve months.","th":"ธนาคารในอเมริกากำลังล้ม ดัชนีหุ้นไทยหายไปเกือบครึ่งในสิบสองเดือน","where":"Market moment","old":"ธนาคารในอเมริกากำลังล้ม ดัชนีกรุงเทพฯ หายไปเกือบครึ่งในสิบสองเดือน","flag":"edited","q":"ดัชนีกรุงเทพฯ is not a Thai term."},{"id":"t366","en":"By 2013 the index stood at 1,299. Every ฿100 you put in was worth ฿289.","th":"ถึงปี 2556 ดัชนีอยู่ที่ 1,299 ทุก ฿100 ที่ลงไปกลายเป็น ฿289","where":"Market moment","old":"ถึงปี 2556 ดัชนีอยู่ที่ 1,299 ทุก ๆ ฿100 ที่ลงไปมีค่า ฿289","flag":"edited","q":"Matches t354."},{"id":"t370","en":"By 2022 the index stood at 1,669. Every ฿100 you put in was worth ฿95.","th":"ถึงปี 2565 ดัชนีอยู่ที่ 1,669 ทุก ฿100 ที่ลงไปกลายเป็น ฿95","where":"Market moment","old":"ถึงปี 2565 ดัชนีอยู่ที่ 1,669 ทุก ๆ ฿100 ที่ลงไปมีค่า ฿95","flag":"edited","q":"Matches t354."},{"id":"t374","en":"of the other lives from your birth got this far.","th":"ของชีวิตอื่นที่เกิดมาแบบเดียวกัน มาได้ถึงตรงนี้","where":"The ending","old":"คือจำนวนชีวิตอื่นจากจุดเริ่มเดียวกันที่มาได้ถึงตรงนี้","flag":"edited","q":"คือจำนวนชีวิต is a nominalisation, and จุดเริ่ม is abstract for 'birth'."},{"id":"t376","en":"The game’s odds of dying in those five years, at your age and health. Most people live through odds like these. It came anyway.","th":"นี่คือโอกาสตายในห้าปีนั้นตามกติกาของเกม ด้วยอายุและสุขภาพอย่างคุณ คนส่วนใหญ่รอดจากตัวเลขแบบนี้ได้ แต่มันก็มาอยู่ดี","where":"The ending","old":"นี่คือโอกาสตายในห้าปีนั้นตามกติกาของเกม ที่อายุและสุขภาพของคุณ คนส่วนใหญ่ผ่านโอกาสแบบนี้ไปได้ แต่มันก็มาอยู่ดี","flag":"edited","q":"ที่อายุ is English 'at your age', and ผ่านโอกาส is a calque."},{"id":"t380","en":"Of {n} decisions, you guarded your money {a} times, your peace of mind {b}, your body {c}.","th":"ตัดสินใจ {n} ครั้ง คุณรักษาเงินไว้ {a} ครั้ง รักษาใจ {b} ครั้ง รักษาร่างกาย {c} ครั้ง","where":"The ending","old":"จาก {n} การตัดสินใจ คุณรักษาเงินไว้ {a} ครั้ง รักษาความสบายใจ {b} ครั้ง รักษาร่างกาย {c} คร · The film on the temple wall"},{"id":"t8","en":"The transistor radio","th":"วิทยุทรานซิสเตอร์","where":"1965 · The transistor radio"},{"id":"t10","en":"Sit with them and listen","th":"นั่งฟังด้วยกัน","where":"1965 · The transistor radio"},{"id":"t12","en":"Save up for your own","th":"เก็บเงินซื้อของตัวเอง","where":"1965 · The transistor radio"},{"id":"t14","en":"Find three friends and a borrowed guitar","th":"ชวนเพื่อนสามคน ยืมกีตาร์มาตัวหนึ่ง","where":"1965 · The transistor radio"},{"id":"t16","en":"The airfield","th":"สนามบิน","where":"1966 · The airfield"},{"id":"t18","en":"Stay on the land","th":"อยู่กับที่นา","where":"1966 · The airfield"},{"id":"t19","en":"You stayed. The planes went over at the same hour every morning, and the buffalo stopped looking up.","th":"คุณอยู่ต่อ เครื่องบินผ่านเวลาเดิมทุกเช้า จนควายเลิกเงยหน้าดู","where":"1966 · The airfield"},{"id":"t25","en":"October 1973","th":"เหตุการณ์ 14 ตุลา","where":"1973 · October 1973"},{"id":"t27","en":"Stay in your room with the radio","th":"อยู่ในห้องกับวิทยุ","where":"1973 · October 1973"},{"id":"t29","en":"Carry water to the crowd","th":"ขนน้ำไปให้คนบนถนน","where":"1973 · October 1973"},{"id":"t31","en":"You went out with water in October 1973 and did not come home.","th":"ตอน 14 ตุลา คุณออกไปส่งน้ำ แล้วไม่ได้กลับบ้าน","where":"History"},{"id":"t32","en":"Walk at the front","th":"เดินแถวหน้า","where":"1973 · October 1973"},{"id":"t33","en":"You walked at the front. The people on either side of you were different by evening.","th":"คุณเดินแถวหน้า พอตกเย็น คนที่เดินขนาบข้างเป็นคนละคนแล้ว","where":"1973 · October 1973"},{"id":"t34","en":"You walked at the front in October 1973 and were shot in the road.","th":"ตอน 14 ตุลา คุณเดินแถวหน้า แล้วถูกยิงกลางถนน","where":"History"},{"id":"t35","en":"The radio plays only music","th":"วิทยุเปิดแต่เพลง","where":"1973 · The radio plays only music"},{"id":"t37","en":"Wait, and keep the radio on","th":"รอ แล้วเปิดวิทยุไว้","where":"1973 · The radio plays only music"},{"id":"t39","en":"Take the bus and look for him","th":"ขึ้นรถไปตามหาเขา","where":"1973 · The radio plays only music"},{"id":"t41","en":"Go to the temple and ask nobody anything","th":"ไปวัด ไม่ถามใครทั้งนั้น","where":"1973 · The radio plays only music"},{"id":"t42","en":"You sat with the other mothers. Nobody said why any of you had come.","th":"คุณนั่งอยู่กับแม่คนอื่นๆ ไม่มีใครพูดว่ามาทำไม","where":"1973 · The radio plays only music"},{"id":"t43","en":"The truck to Bangkok","th":"รถบรรทุกเข้ากรุงเทพฯ","where":"1973 · The truck to Bangkok"},{"id":"t45","en":"Stay in the truck and do as you are told","th":"อยู่บนรถ เขาสั่งอะไรก็ทำตาม","where":"1973 · The truck to Bangkok"},{"id":"t47","en":"Say your stomach is bad and fall out","th":"บอกว่าปวดท้อง แล้วขอออกจากแถว","where":"1973 · The truck to Bangkok"},{"id":"t49","en":"Go, and fire over their heads","th":"ไป แล้วยิงข้ามหัว","where":"1973 · The truck to Bangkok"},{"id":"t51","en":"The first week of October 1976","th":"ต้นเดือนตุลา 2519","where":"1976 · The first week of October 1976"},{"id":"t53","en":"Stay away from the university","th":"ไม่เข้าใกล้มหาวิทยาลัย","where":"1976 · The first week of October 1976"},{"id":"t54","en":"You stayed away. In the morning you counted who was left, and you have never stopped counting.","th":"คุณไม่ไป พอเช้าก็นับว่าใครยังอยู่ และไม่เคยเลิกนับ","where":"1976 · The first week of October 1976"},{"id":"t55","en":"Burn the books in the yard","th":"เผาหนังสือกลางลานบ้าน","where":"1976 · The first week of October 1976"},{"id":"t57","en":"Take food to the gate","th":"เอาข้าวไปส่งที่หน้าประตู","where":"1976 · The first week of October 1976"},{"id":"t60","en":"Leave for the forest with the others","th":"เข้าป่าไปกับคนอื่นๆ","where":"1976 · The first week of October 1976"},{"id":"t62","en":"A list of names","th":"รายชื่อ","where":"1976 · A list of names"},{"id":"t64","en":"Say you know nothing","th":"บอกว่าไม่รู้อะไรเลย","where":"1976 · A list of names"},{"id":"t66","en":"Warn the student","th":"เตือนนักศึกษา","where":"1976 · A list of names"},{"id":"t67","en":"You pushed a note under the door. You never found out what became of them.","th":"คุณสอดกระดาษไว้ใต้ประตู ไม่เคยรู้เลยว่าเขาเป็นยังไงต่อ","where":"1976 · A list of names"},{"id":"t68","en":"Somebody wrote your name down in 1976.","th":"ปี 2519 มีคนจดชื่อคุณไว้","where":"History"},{"id":"t69","en":"Tell him what you know","th":"บอกเขาเท่าที่รู้","where":"1976 · A list of names"},{"id":"t71","en":"Rice at night","th":"ข้าวตอนกลางคืน","where":"1975 · Rice at night"},{"id":"t73","en":"Say you sleep early","th":"บอกว่านอนหัวค่ำ","where":"1975 · Rice at night"},{"id":"t75","en":"Keep giving the rice","th":"ให้ข้าวต่อไป","where":"1975 · Rice at night"},{"id":"t77","en":"Soldiers came to the village for the people who had given rice.","th":"ทหารเข้ามาในหมู่บ้าน หาคนที่เคยให้ข้าว","where":"History"},{"id":"t78","en":"Tell the officer","th":"บอกนายทหาร","where":"1975 · Rice at night"},{"id":"t79","en":"The officer was pleased. Your neighbours stopped asking you to their ordinations.","th":"นายทหารพอใจ เพื่อนบ้านเลิกเชิญคุณไปงานบวช","where":"1975 · Rice at night"},{"id":"t80","en":"Come home","th":"กลับบ้าน","where":"1980 · Come home"},{"id":"t82","en":"Walk out and sign the paper","th":"เดินออกมาเซ็นชื่อ","where":"1980 · Come home"},{"id":"t84","en":"Stay until it is finished","th":"อยู่จนกว่าจะจบ","where":"1980 · Come home"},{"id":"t85","en":"You stayed. There were fewer of you every season, and then it was only an argument about a map.","th":"คุณอยู่ต่อ คนน้อยลงทุกฤดู แล้วก็เหลือแค่เถียงกันเรื่องแผนที่","where":"1980 · Come home"},{"id":"t87","en":"The agent from Bangkok","th":"นายหน้าจากกรุงเทพฯ","where":"1982 · The agent from Bangkok"},{"id":"t89","en":"Stay","th":"อยู่","where":"1982 · The agent from Bangkok"},{"id":"t95","en":"The factory bus","th":"รถโรงงาน","where":"1985 · The factory bus"},{"id":"t97","en":"Stay for the transplanting","th":"อยู่ช่วยดำนา","where":"1985 · The factory bus"},{"id":"t98","en":"You stayed that year, and the next. The bus stopped coming to your road.","th":"ปีนั้นคุณอยู่ ปีต่อมาก็อยู่ รถเลิกผ่านถนนบ้านคุณ","where":"1985 · The factory bus"},{"id":"t99","en":"Get on the bus","th":"ขึ้นรถ","where":"1985 · The factory bus"},{"id":"t101","en":"The road is coming","th":"ถนนกำลังจะมา","where":"1988 · The road is coming"},{"id":"t103","en":"Keep the land","th":"เก็บที่ไว้","where":"1988 · The road is coming"},{"id":"t106","en":"The road went through the next district. You still had the land.","th":"ถนนไปผ่านอำเภอข้างๆ คุณยังมีที่ดินอยู่","where":"1988 · The road is coming"},{"id":"t107","en":"Sell it all","th":"ขายหมด","where":"1988 · The road is coming"},{"id":"t109","en":"Sell the half by the road","th":"ขายครึ่งที่ติดถนน","where":"1988 · The road is coming"},{"id":"t111","en":"May 1992","th":"พฤษภา 35","where":"1992 · May 1992"},{"id":"t113","en":"Go home and lock the gate","th":"กลับบ้านแล้วล็อกประตูรั้ว","where":"1992 · May 1992"},{"id":"t115","en":"Drive the injured to hospital","th":"ขับรถพาคนเจ็บไปโรงพยาบาล","where":"1992 · May 1992"},{"id":"t116","en":"You had to have the back seat replaced. The man at the garage did not charge you and did not ask.","th":"คุณต้องเปลี่ยนเบาะหลัง ช่างที่อู่ไม่คิดเงินและไม่ถามอะไร","where":"1992 · May 1992"},{"id":"t117","en":"You were driving the injured to hospital in May 1992.","th":"พฤษภา 35 คุณกำลังขับรถพาคนเจ็บไปโรงพยาบาล","where":"History"},{"id":"t118","en":"Stand on Ratchadamnoen","th":"ไปยืนบนถนนราชดำเนิน","where":"1992 · May 1992"},{"id":"t121","en":"Everyone is borrowing","th":"ใครๆ ก็กู้","where":"1996 · Everyone is borrowing"},{"id":"t123","en":"Pay off what you owe and hold cash","th":"ใช้หนี้ให้หมด แล้วถือเงินสดไว้","where":"1996 · Everyone is borrowing"},{"id":"t126","en":"Buy a flat off the plan with a dollar loan","th":"กู้ดอลลาร์จองคอนโดตั้งแต่ยังไม่สร้าง","where":"1996 · Everyone is borrowing"},{"id":"t127","en":"You chose the unit with the river view from a model made of foam.","th":"คุณเลือกห้องวิวแม่น้ำจากโมเดลที่ทำด้วยโฟม","where":"1996 · Everyone is borrowing"},{"id":"t129","en":"Put the savings with the finance company","th":"เอาเงินเก็บไปฝากบริษัทเงินทุน","where":"1996 · Everyone is borrowing"},{"id":"t132","en":"The notice on the gate","th":"ประกาศที่ประตูโรงงาน","where":"1997 · The notice on the gate"},{"id":"t134","en":"Wait near the gate for news","th":"รอฟังข่าวอยู่หน้าประตู","where":"1997 · The notice on the gate"},{"id":"t135","en":"Three hundred of you waited for eleven days. Someone brought rice. No one brought wages.","th":"พวกคุณสามร้อยคนรออยู่สิบเอ็ดวัน มีคนเอาข้าวมาให้ ไม่มีใครเอาค่าแรงมา","where":"1997 · The notice on the gate"},{"id":"t136","en":"Go back up-country","th":"กลับบ้านนอก","where":"1997 · The notice on the gate"},{"id":"t140","en":"Two colours at one table","th":"สองสีบนโต๊ะเดียว","where":"2010 · Two colours at one table"},{"id":"t147","en":"Nobody spoke for a while. Then someone asked for the fish sauce, and that was the peace.","th":"ทุกคนเงียบไปพักหนึ่ง แล้วมีคนขอน้ำปลา นั่นแหละคือสันติภาพ","where":"2010 · Two colours at one table"},{"id":"t148","en":"The water stays","th":"น้ำไม่ลด","where":"2011 · The water stays"},{"id":"t150","en":"Stay upstairs with the house","th":"อยู่เฝ้าบ้านชั้นบน","where":"2011 · The water stays"},{"id":"t152","en":"Leave for a relative up-country","th":"ไปอยู่กับญาติต่างจังหวัด","where":"2011 · The water stays"},{"id":"t153","en":"You locked a door that was already under water. You still have the key.","th":"คุณล็อกประตูที่จมน้ำไปแล้ว กุญแจยังอยู่กับคุณ","where":"2011 · The water stays"},{"id":"t154","en":"Stay and help the soi","th":"อยู่ช่วยคนในซอย","where":"2011 · The water stays"},{"id":"t155","en":"You learned the names of people you had nodded at for thirty years.","th":"คุณได้รู้ชื่อคนที่พยักหน้าทักกันมาสามสิบปี","where":"2011 · The water stays"},{"id":"t156","en":"Through the glass","th":"หลังกระจก","where":"2020 · Through the glass"},{"id":"t158","en":"Watch it on the phone","th":"ดูทางมือถือ","where":"2020 · Through the glass"},{"id":"t159","en":"The picture froze at the chanting. You stayed in front of it until the end anyway.","th":"ภาพค้างตอนสวด คุณยังนั่งดูจนจบอยู่ดี","where":"2020 · Through the glass"},{"id":"t160","en":"Go anyway, in a mask","th":"ไปอยู่ดี ใส่หน้ากาก","where":"2020 · Through the glass"},{"id":"t161","en":"You went. You stood at the back and made merit for two.","th":"คุณไป ยืนอยู่ข้างหลัง ทำบุญให้สองคน","where":"2020 · Through the glass"},{"id":"t163","en":"The Sarit coup","th":"รัฐประหารของจอมพลสฤษดิ์","where":"History"},{"id":"t164","en":"Field Marshal Sarit seizes power. Schools learn to salute a new portrait.","th":"จอมพลสฤษดิ์ยึดอำนาจ โรงเรียนหัดทำความเคารพรูปใหม่","where":"History"},{"id":"t165","en":"Martial law","th":"กฎอัยการศึก","where":"History"},{"id":"t167","en":"Sarit dies","th":"จอมพลสฤษดิ์เสียชีวิต","where":"History"},{"id":"t169","en":"American airbases","th":"ฐานทัพอเมริกัน","where":"History"},{"id":"t171","en":"Communist insurgency","th":"สู้รบกับคอมมิวนิสต์","where":"History"},{"id":"t174","en":"October 1976","th":"เหตุการณ์ 6 ตุลา","where":"History"},{"id":"t175","en":"Police, soldiers and mobs attack students at Thammasat University. That evening the army takes power again.","th":"ตำรวจ ทหาร และฝูงชนบุกทำร้ายนักศึกษาที่มหาวิทยาลัยธรรมศาสตร์ เย็นนั้นทหารยึดอำนาจอีกครั้ง","where":"History"},{"id":"t176","en":"The bases close","th":"ฐานทัพปิด","where":"History"},{"id":"t178","en":"Amnesty","th":"นิรโทษกรรม","where":"History"},{"id":"t179","en":"The government offers amnesty. People walk out of the forests. Some families are still waiting.","th":"รัฐบาลเสนอนิรโทษกรรม คนเดินออกจากป่า บางครอบครัวยังรออยู่","where":"History"},{"id":"t180","en":"April coup attempt","th":"กบฏเมษาฮาวาย","where":"History"},{"id":"t181","en":"Young officers try to overthrow the government. Tanks stand in Bangkok for three days.","th":"นายทหารหนุ่มพยายามโค่นรัฐบาล รถถังจอดอยู่ในกรุงเทพฯ สามวัน","where":"History"},{"id":"t182","en":"The boom begins","th":"เศรษฐกิจเริ่มบูม","where":"History"},{"id":"t183","en":"The economy takes off. Bangkok builds towers. A paved road reaches another province.","th":"เศรษฐกิจพุ่ง กรุงเทพฯ ผุดตึกสูง ถนนลาดยางไปถึงอีกจังหวัดหนึ่ง","where":"History"},{"id":"t184","en":"The coup of 1991","th":"รัฐประหารปี 2534","where":"History"},{"id":"t186","en":"Crowds fill Bangkok against the general who took power. The army fires. Families are still asking where some of them went.","th":"ฝูงชนเต็มกรุงเทพฯ ต่อต้านนายพลที่ยึดอำนาจ ทหารยิง ครอบครัวยังถามกันอยู่ว่าบางคนหายไปไหน","where":"History"},{"id":"t187","en":"The baht falls","th":"ลอยตัวค่าบาท","where":"History"},{"id":"t188","en":"The baht collapses. Factories close. Finance companies shut their doors. People you know lose everything.","th":"ค่าเงินบาทดิ่งลง โรงงานปิด บริษัทเงินทุนปิดกิจการ คนที่คุณรู้จักหมดตัว","where":"History"},{"id":"t189","en":"A landslide","th":"ชนะถล่มทลาย","where":"History"},{"id":"t190","en":"A new party wins by a landslide. Families begin to argue about it at dinner.","th":"พรรคใหม่ชนะถล่มทลาย ครอบครัวเริ่มเถียงกันบนโต๊ะกินข้าว","where":"History"},{"id":"t191","en":"The tsunami","th":"สึนามิ","where":"History"},{"id":"t193","en":"The coup of 2006","th":"รัฐประหารปี 2549","where":"History"},{"id":"t195","en":"Bangkok burns","th":"กรุงเทพฯ ไหม้","where":"History"},{"id":"t196","en":"Protesters occupy central Bangkok for two months. Troops clear them. Ninety-one die.","th":"ผู้ชุมนุมยึดใจกลางกรุงเทพฯ สองเดือน ทหารเข้าสลาย ตายเก้าสิบเอ็ดคน","where":"History"},{"id":"t197","en":"The great flood","th":"น้ำท่วมใหญ่","where":"History"},{"id":"t198","en":"The flood covers the central plains and reaches the edge of Bangkok. In some streets the water stays two months.","th":"น้ำท่วมภาคกลางจนถึงขอบกรุงเทพฯ บางถนนน้ำขังอยู่สองเดือน","where":"History"},{"id":"t199","en":"The coup of 2014","th":"รัฐประหารปี 2557","where":"History"},{"id":"t201","en":"A year in black","th":"หนึ่งปีในชุดดำ","where":"History"},{"id":"t202","en":"The radio goes quiet. The country wears black for a year. You wear it too.","th":"วิทยุเงียบลง ทั้งประเทศใส่ชุดดำอยู่หนึ่งปี คุณก็ใส่ด้วย","where":"History"},{"id":"t203","en":"The virus","th":"ไวรัส","where":"History"},{"id":"t205","en":"At {n} you chose: {label}. Same birth, same luck, and the other roads:","th":"ตอนอายุ {n} คุณเลือก {label} เกิดมาแบบเดียวกัน ดวงเดียวกัน ส่วนทางอื่นเป็นอย่างนี้:","where":"History"},{"id":"t206","en":"You live to {n}. {money}. Wellbeing {w}. Health {h}.","th":"คุณอยู่มาถึงอายุ {n} {money} ความเป็นอยู่ที่ดี {w} สุขภาพ {h}","where":"History"},{"id":"t207","en":"See your life →","th":"ดูชีวิตของคุณ →","where":"History"},{"id":"t213","en":"Say yes to the oil press family","th":"ตกลงกับบ้านโรงหีบน้ำมัน","where":"Question at age 20"},{"id":"t216","en":"Take the letter and go to Bangkok","th":"หยิบจดหมายแล้วไปกรุงเทพฯ","where":"Question at age 20"},{"id":"t219","en":"The press became three factories. Your name was on none of them.","th":"โรงหีบกลายเป็นโรงงานสามแห่ง ไม่มีแห่งไหนมีชื่อคุณ","where":"History"},{"id":"t220","en":"You sent money home every month, and went back for the funerals.","th":"คุณส่งเงินกลับบ้านทุกเดือน และกลับไปอีกทีตอนงานศพ","where":"History"},{"id":"t224","en":"The same road and the same people, for life.","th":"ถนนเส้นเดิม คนหน้าเดิม ไปตลอดชีวิต","where":"Question at age 20"},{"id":"t225","en":"You stayed. You still keep a Bangkok bus timetable in the drawer.","th":"คุณอยู่ต่อ ตารางรถเมล์กรุงเทพฯ ยังอยู่ในลิ้นชัก","where":"Question at age 20"},{"id":"t226","en":"A big house, and their name on everything.","th":"บ้านหลังใหญ่ และทุกอย่างเป็นชื่อเขา","where":"Question at age 20"},{"id":"t230","en":"You learned to count in English.","th":"คุณนับเลขภาษาอังกฤษเป็น","where":"1966 · The airfield"},{"id":"t233","en":"You left a sack by the bamboo. Some mornings it was someone you grew up with who had taken it.","th":"คุณวางกระสอบไว้ข้างกอไผ่ บางเช้าคนที่เอาไปคือคนที่โตมาด้วยกัน","where":"1975 · Rice at night"},{"id":"t235","en":"You stayed in the forest after the amnesty. Someone at home kept your place laid at the table.","th":"หลังนิรโทษกรรม คุณยังอยู่ในป่า คนที่บ้านยังจัดที่เผื่อคุณไว้ที่วงข้าว","where":"History"},{"id":"t239","en":"You signed. Nobody came out of the house.","th":"คุณเซ็น ไม่มีใครออกมาจากบ้าน","where":"1988 · The road is coming"},{"id":"t241","en":"You watched it later on a foreign channel, because the Thai channels were showing something else.","th":"คุณมาดูทีหลังจากช่องต่างประเทศ เพราะช่องไทยฉายอย่างอื่น","where":"1992 · May 1992"},{"id":"t242","en":"You stood there, heavier and slower than the students, and more frightened.","th":"คุณยืนอยู่ตรงนั้น อ้วนกว่าและช้ากว่านักศึกษา และกลัวกว่า","where":"1992 · May 1992"},{"id":"t246","en":"You went back to a field. Your hands remembered, and your back did not.","th":"คุณกลับไปที่ทุ่งนา มือยังจำได้ หลังจำไม่ได้","where":"1997 · The notice on the gate"},{"id":"t249","en":"You said it, and you have not been invited since.","th":"คุณพูดไป แล้วก็ไม่มีใครชวนอีกเลย","where":"2010 · Two colours at one table"},{"id":"t252","en":"The army overthrows the elected government. Soldiers stand at the intersections.","th":"กองทัพโค่นรัฐบาลจากการเลือกตั้ง ทหารยืนตามสี่แยก","where":"History"},{"id":"t253","en":"You knew everyone in the district, and you went to all their funerals.","th":"คุณรู้จักทุกคนในอำเภอ และไปงานศพของพวกเขาทุกงาน","where":"History"},{"id":"t255","en":"Nobody has told you this will matter.","th":"ไม่มีใครบอกว่าเรื่องนี้จะสำคัญ","where":"Question at age 10"},{"id":"t256","en":"Learn the words","th":"หัดพูดคำพวกนั้น","where":"Question at age 10"},{"id":"t257","en":"Your friends have a new joke.","th":"เพื่อนมีเรื่องล้อใหม่","where":"Question at age 10"},{"id":"t263","en":"The catch pays for the school shoes.","th":"ปลาที่จับได้คือค่ารองเท้านักเรียน","where":"Question at age 10"},{"id":"t264","en":"Go out on the boat","th":"ออกเรือ","where":"Question at age 10"},{"id":"t267","en":"Stay in school","th":"อยู่เรียนต่อ","where":"Question at age 10"},{"id":"t272","en":"Stay with the buffalo","th":"อยู่เลี้ยงควาย","where":"Question at age 10"},{"id":"t273","en":"A younger child gets the school.","th":"น้องจะได้เรียนแทน","where":"Question at age 10"},{"id":"t274","en":"You stayed with the buffalo. The younger one read to you at night, for a while.","th":"คุณอยู่เลี้ยงควาย น้องอ่านหนังสือให้ฟังตอนกลางคืน อยู่พักหนึ่ง","where":"Question at age 10"},{"id":"t275","en":"Ask to go to school","th":"ขอไปโรงเรียน","where":"Question at age 10"},{"id":"t276","en":"A younger child stays home instead.","th":"น้องต้องอยู่บ้านแทน","where":"Question at age 10"},{"id":"t279","en":"Your teacher has offered to come and speak to them.","th":"ครูเสนอว่าจะมาคุยกับพ่อแม่ให้","where":"Question at age 15"},{"id":"t280","en":"Leave it","th":"ปล่อยไป","where":"Question at age 15"},{"id":"t281","en":"You will be the one who stays.","th":"คนที่ต้องอยู่คือคุณ","where":"Question at age 15"},{"id":"t283","en":"Let the teacher speak to them","th":"ให้ครูมาคุย","where":"Question at age 15"},{"id":"t284","en":"Your parents will not forget being told in their own house.","th":"พ่อแม่จะไม่ลืมที่ถูกสอนในบ้านตัวเอง","where":"Question at age 15"},{"id":"t288","en":"Ordain and go","th":"บวชแล้วไป","where":"Question at age 15"},{"id":"t289","en":"You will not come home for a long time.","th":"อีกนานกว่าจะได้กลับบ้าน","where":"Question at age 15"},{"id":"t291","en":"Stay and work the land","th":"อยู่ทำนา","where":"Question at age 15"},{"id":"t292","en":"The abbot does not ask twice.","th":"เจ้าอาวาสไม่ถามซ้ำ","where":"Question at age 15"},{"id":"t295","en":"If you go you will tell yourself it is for five years.","th":"ถ้าไป คุณจะบอกตัวเองว่าแค่ห้าปี","where":"Question at age 30"},{"id":"t296","en":"Stay in Thailand","th":"อยู่เมืองไทย","where":"Question at age 30"},{"id":"t297","en":"You will always know what the salary was.","th":"คุณจะจำตัวเลขเงินเดือนนั้นได้เสมอ","where":"Question at age 30"},{"id":"t298","en":"You stayed. You kept the letter for a long time, in the drawer with the deeds.","th":"คุณอยู่ และเก็บจดหมายนั้นไว้นาน ในลิ้นชักเดียวกับโฉนด","where":"Question at age 30"},{"id":"t299","en":"Go to America","th":"ไปอเมริกา","where":"Question at age 30"},{"id":"t300","en":"You will hear about the funerals by telephone.","th":"ข่าวงานศพจะมาทางโทรศัพท์","where":"Question at age 30"},{"id":"t301","en":"You went. It was not five years.","th":"คุณไป แล้วมันก็ไม่ใช่แค่ห้าปี","where":"Question at age 30"},{"id":"t302","en":"Your child’s teacher says a child like this comes along once in a career, and there is a place at a university abroad. It would take the house.","th":"ครูของลูกบอกว่าเด็กแบบนี้ทั้งชีวิตครูเจอครั้งเดียว และมีที่เรียนในมหาวิทยาลัยเมืองนอก แต่ต้องแลกด้วยบ้าน","where":"Question at age 40"},{"id":"t304","en":"Sell the house","th":"ขายบ้าน","where":"Question at age 40"},{"id":"t305","en":"You will rent, at your age, and you may never be thanked.","th":"อายุป่านนี้ต้องเช่าบ้าน และอาจไม่มีใครขอบคุณ","where":"Question at age 40"},{"id":"t307","en":"Your child will find a way, or will not, and will remember.","th":"ลูกจะหาทางได้หรือไม่ได้ก็ตาม เขาจะจำ","where":"Question at age 40"},{"id":"t308","en":"You kept the house. The child found a way, and told people they had found it alone.","th":"คุณเก็บบ้านไว้ ลูกหาทางจนได้ แล้วบอกใครต่อใครว่าหาเอง","where":"Question at age 40"},{"id":"t309","en":"Forestry","th":"วนศาสตร์","where":"New roads and childhood"},{"id":"t310","en":"Frogs after the rain","th":"กบหลังฝน","where":"New roads and childhood"},{"id":"t312","en":"Go out with the torch","th":"ถือไฟฉายออกไป","where":"New roads and childhood"},{"id":"t313","en":"You came home muddy, with enough for a meal.","th":"คุณกลับบ้านตัวเปื้อนโคลน ได้กบพอกินหนึ่งมื้อ","where":"New roads and childhood"},{"id":"t316","en":"The bell on the soi","th":"เสียงกระดิ่งในซอย","where":"New roads and childhood"},{"id":"t318","en":"Buy one and share it","th":"ซื้อแล้วแบ่งกัน","where":"New roads and childhood"},{"id":"t319","en":"You got half, and your cousin remembered.","th":"คุณได้ครึ่งเดียว และญาติคนนั้นจำได้","where":"New roads and childhood"},{"id":"t320","en":"Buy one and keep it","th":"ซื้อแล้วกินเอง","where":"New roads and childhood"},{"id":"t322","en":"Keep the coin","th":"เก็บเหรียญไว้","where":"New roads and childhood"},{"id":"t323","en":"You kept the coin in a tin for a while.","th":"คุณเก็บเหรียญไว้ในกระป๋องอยู่พักหนึ่ง","where":"New roads and childhood"},{"id":"t324","en":"Before light","th":"ก่อนฟ้าสาง","where":"New roads and childhood"},{"id":"t326","en":"Get up and carry it","th":"ลุกไปช่วยถือ","where":"New roads and childhood"},{"id":"t328","en":"Stay in bed","th":"นอนต่อ","where":"New roads and childhood"},{"id":"t330","en":"Three ways to count this life","th":"สามวิธีนับชีวิตนี้","where":"New roads and childhood"},{"id":"t332","en":"Responsibility beyond them","th":"ความรับผิดชอบต่อคนอื่น","where":"New roads and childhood"},{"id":"t333","en":"Higher than {n} of 100 lives from your birth","th":"สูงกว่า {n} จาก 100 ชีวิตที่เกิดแบบเดียวกัน","where":"New roads and childhood"},{"id":"t334","en":"With the numbers in front of you","th":"เมื่อตัวเลขอยู่ตรงหน้า","where":"New roads and childhood"},{"id":"t335","en":"{year}: index {a}. You put money in. Five years later: {b}.","th":"ปี {year}: ดัชนี {a} คุณลงเงิน ห้าปีต่อมา: {b}","where":"New roads and childhood"},{"id":"t336","en":"{year}: index {a}. You stayed out. Five years later: {b}.","th":"ปี {year}: ดัชนี {a} คุณไม่ลงเงิน ห้าปีต่อมา: {b}","where":"New roads and childhood"},{"id":"t337","en":"You bought near a high {a} times and near a low {b} times.","th":"คุณซื้อตอนใกล้จุดสูง {a} ครั้ง และตอนใกล้จุดต่ำ {b} ครั้ง","where":"New roads and childhood"},{"id":"t341","en":"The person who sent you this life","th":"คนที่ส่งชีวิตนี้มาให้","where":"New roads and childhood"},{"id":"t342","en":"Lived to","th":"อยู่ถึงอายุ","where":"New roads and childhood"},{"id":"t343","en":"Them","th":"เขา","where":"New roads and childhood"},{"id":"t347","en":"This is the whole record so far. Nobody can show you next year.","th":"นี่คือตัวเลขทั้งหมดเท่าที่มี ไม่มีใครบอกปีหน้าได้","where":"Market moment"},{"id":"t350","en":"Keep it out","th":"เก็บไว้ ไม่ลง","where":"Market moment"},{"id":"t352","en":"You put half your savings into the market in 1978.","th":"ปี 2521 คุณเอาเงินเก็บครึ่งหนึ่งลงตลาดหุ้น","where":"Market moment"},{"id":"t353","en":"You kept your money out of the market in 1978.","th":"ปี 2521 คุณไม่เอาเงินลงตลาดหุ้น","where":"Market moment"},{"id":"t356","en":"You put half your savings into the market in 1993.","th":"ปี 2536 คุณเอาเงินเก็บครึ่งหนึ่งลงตลาดหุ้น","where":"Market moment"},{"id":"t357","en":"You kept your money out of the market in 1993.","th":"ปี 2536 คุณไม่เอาเงินลงตลาดหุ้น","where":"Market moment"},{"id":"t360","en":"You put half your savings into the market in 1998.","th":"ปี 2541 คุณเอาเงินเก็บครึ่งหนึ่งลงตลาดหุ้น","where":"Market moment"},{"id":"t361","en":"You kept your money out of the market in 1998.","th":"ปี 2541 คุณไม่เอาเงินลงตลาดหุ้น","where":"Market moment"},{"id":"t364","en":"You put half your savings into the market in 2008.","th":"ปี 2551 คุณเอาเงินเก็บครึ่งหนึ่งลงตลาดหุ้น","where":"Market moment"},{"id":"t365","en":"You kept your money out of the market in 2008.","th":"ปี 2551 คุณไม่เอาเงินลงตลาดหุ้น","where":"Market moment"},{"id":"t367","en":"The index has closed the year higher than any December before it. The bank pays almost nothing on savings.","th":"ดัชนีปิดสิ้นปีสูงกว่าทุกเดือนธันวาคมที่ผ่านมา ส่วนเงินฝากแทบไม่ได้ดอกเบี้ย","where":"Market moment"},{"id":"t368","en":"You put half your savings into the market in 2017.","th":"ปี 2560 คุณเอาเงินเก็บครึ่งหนึ่งลงตลาดหุ้น","where":"Market moment"},{"id":"t369","en":"You kept your money out of the market in 2017.","th":"ปี 2560 คุณไม่เอาเงินลงตลาดหุ้น","where":"Market moment"},{"id":"t371","en":"What this life said","th":"สิ่งที่ชีวิตนี้บอก","where":"The ending"},{"id":"t372","en":"1 in {n}","th":"1 ใน {n}","where":"The ending"},{"id":"t373","en":"{n} of 100","th":"{n} จาก 100","where":"The ending"},{"id":"t375","en":"The game’s odds of dying in those five years. In good health they would have been 1 in {a}. Your health had come down to {b}.","th":"นี่คือโอกาสตายในห้าปีนั้นตามกติกาของเกม ถ้าร่างกายยังดีจะอยู่ที่ 1 ใน {a} สุขภาพคุณลดลงเหลือ {b}","where":"The ending"},{"id":"t377","en":"Without the smoking: 1 in {n}.","th":"ถ้าไม่สูบบุหรี่: 1 ใน {n}","where":"The ending"},{"id":"t378","en":"Money rose in {a} of your {n} chapters. Wellbeing rose in {b}.","th":"เงินเพิ่มขึ้นใน {a} จาก {n} ช่วงชีวิต ความเป็นอยู่ที่ดีเพิ่มขึ้นใน {b} ช่วง","where":"The ending"},{"id":"t379","en":"Age {a} → {b}","th":"อายุ {a} → {b}","where":"The ending"},{"id":"t381","en":"Other road: {road}","th":"อีกทางหนึ่ง: {road}","where":"The ending"},{"id":"t382","en":"Five years down it: health {a}, wellbeing {b}, against the road you took.","th":"ห้าปีบนทางนั้น: สุขภาพ {a} ความเป็นอยู่ที่ดี {b} เทียบกับทางที่คุณเลือก","where":"The ending"},{"id":"t383","en":"Named in this life: ","th":"ชื่อที่อยู่ในชีวิตนี้: ","where":"The ending"},{"id":"t384","en":"A child","th":"ลูกคนหนึ่ง","where":"The ending"},{"id":"t385","en":"({a}–{b})","th":"({a}–{b})","where":"The ending"},{"id":"t386","en":"(from {n})","th":"(ตั้งแต่อายุ {n})","where":"The ending"},{"id":"t387","en":"The record names no friend and no partner.","th":"บันทึกนี้ไม่มีชื่อเพื่อนหรือคู่ชีวิตเลย","where":"The ending"},{"id":"t391","en":"Wellbeing fell furthest between {a} and {b}. Same birth, same world. What would you do with those years?","th":"ความเป็นอยู่ที่ดีลดลงมากที่สุดช่วงอายุ {a} ถึง {b} จุดเริ่มเดิม โลกเดิม คุณจะทำอะไรกับปีเหล่านั้น?","where":"The ending"},{"id":"t393","en":"Game model, not a forecast. Odds and comparisons come from this game’s rules.","th":"แบบจำลองของเกม ไม่ใช่การพยากรณ์ ตัวเลขทั้งหมดมาจากกติกาของเกมนี้","where":"The ending"},{"id":"t394","en":"The numbers","th":"ตัวเลข","where":"The ending"}]</script>
<script>
const LINES=JSON.parse(document.getElementById('lines').textContent);
const state={};let db=null,filter='need';
const $=id=>document.getElementById(id),esc=s=>{const d=document.createElement('div');d.textContent=s;return d;};
const KEY='life-thai-read-v1';
try{Object.assign(state,JSON.parse(localStorage.getItem(KEY)||'{}'));}catch{}
const remember=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));}catch{}};
function say(t){$('status').textContent=t;}
async function save(id){remember();if(!db){say('บันทึกไว้ในเครื่องนี้ กด “คัดลอกที่แก้” แล้วส่งให้ผม');return;}try{const v=state[id];if(v)await db.doc('lines/'+id).set({...v,at:Date.now()});else await db.doc('lines/'+id).delete();say('บันทึกแล้ว');}catch{say('บันทึกไม่สำเร็จ เก็บไว้ในเครื่องนี้แล้ว กด “คัดลอกที่แก้” แล้วส่งให้ผม');}}
function counts(){const done=LINES.filter(l=>state[l.id]).length;$('count').textContent=done+' / '+LINES.length;}
function shown(l){if(filter==='all')return true;if(filter==='fix')return state[l.id]?.v==='fix';return !!l.flag&&!state[l.id];}
function card(l){const a=document.createElement('article'),st=state[l.id];if(st)a.className='done';
 const th=document.createElement('p');th.className='th';th.lang='th';th.textContent=st?.v==='fix'?st.text:l.th;a.append(th);
 if(l.old){const o=document.createElement('p');o.className='old';o.lang='th';o.textContent=l.old;a.append(o);}
 const en=document.createElement('p');en.className='en';en.lang='en';en.textContent=l.en;a.append(en);
 if(l.flag==='check'){const q=document.createElement('p');q.className='q';q.lang='th';q.textContent=l.q;a.append(q);}
 const act=document.createElement('div');act.className='act';
 const ok=document.createElement('button');ok.type='button';ok.textContent='ใช้ได้';if(st?.v==='ok')ok.className='on';ok.setAttribute('aria-label','ใช้ได้: '+l.th.slice(0,30));
 ok.onclick=()=>{if(state[l.id]?.v==='ok')delete state[l.id];else state[l.id]={v:'ok'};save(l.id);refresh(a,l);};
 const fix=document.createElement('button');fix.type='button';fix.textContent=st?.v==='fix'?'แก้อีก':'แก้';if(st?.v==='fix')fix.className='on';
 fix.onclick=()=>{if(a.querySelector('textarea'))return;const t=document.createElement('textarea');t.id='edit-'+l.id;t.lang='th';t.setAttribute('aria-label','ประโยคที่แก้');t.value=state[l.id]?.text??l.th;const s=document.createElement('button');s.type='button';s.textContent='บันทึก';s.onclick=()=>{const v=t.value.trim();if(!v)return;if(v===l.th)state[l.id]={v:'ok'};else state[l.id]={v:'fix',text:v};save(l.id);refresh(a,l);};a.insertBefore(t,act);act.replaceChildren(s);t.focus();};
 act.append(ok,fix);a.append(act);return a;}
function refresh(a,l){counts();if(shown(l)||filter==='all')a.replaceWith(card(l));else{a.remove();if(!document.querySelector('#list article'))render();}}
function render(){const list=$('list');list.replaceChildren();let last='';const rows=LINES.filter(shown);for(const l of rows){if(l.where!==last){last=l.where;const h=document.createElement('p');h.className='scene';h.lang='en';h.textContent=l.where;list.append(h);}list.append(card(l));}if(!rows.length){const e=document.createElement('p');e.className='note';e.textContent=filter==='fix'?'ยังไม่มีบรรทัดที่แก้':'ส่วนนี้อ่านครบแล้ว ขอบคุณครับ';list.append(e);}counts();}
for(const [id,f] of [['f-need','need'],['f-all','all'],['f-fix','fix']])$(id).onclick=()=>{filter=f;for(const b of ['f-need','f-all','f-fix'])$(b).setAttribute('aria-pressed',b===id);render();window.scrollTo(0,0);};
$('copy').onclick=()=>{const text=LINES.filter(l=>state[l.id]?.v==='fix').map(l=>l.id+'\t'+l.en+'\t'+state[l.id].text).join('\n')||'ยังไม่มีบรรทัดที่แก้';navigator.clipboard.writeText(text).then(()=>say('คัดลอกแล้ว'),()=>{const t=document.createElement('textarea');t.id='copy-out';t.value=text;$('list').prepend(t);t.select();say('เลือกข้อความด้านบนแล้วคัดลอกเอง');});};
render();
window.claude?.use?.('db').then(async d=>{if(!d){say('บันทึกไว้ในเครื่องนี้');return;}db=d;try{const snap=await d.collection('lines').get();for(const doc of snap.docs){const x=doc.data();if(x?.v)state[doc.id]={v:x.v,...(x.text?{text:x.text}:{})};}remember();render();}catch{say('อ่านผลเดิมไม่ได้ ยังบันทึกต่อได้');}});
</script>
